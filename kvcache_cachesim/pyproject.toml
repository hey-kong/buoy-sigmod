[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvcache-cachesim"
version = "0.1.0"
description = "Prefix KV cache simulator for evaluating tiered cache eviction algorithms."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
]

[project.scripts]
kvcache-cachesim = "run:main"

[tool.setuptools]
py-modules = ["gen_tmp_trace", "kv_calculator", "run"]
packages = ["eviction"]
