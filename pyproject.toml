[project]
name = "buoy"
version = "0.1.0"
description = "Buoy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets==2.18.0",
    "tabulate==0.9.0",
    "torch==2.7.1",
    "tqdm==4.67.1",
    "transformers==4.56.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
